[tool.poetry]
name = "yad2-notification-bot"
version = "0.1.0"
description = "Telegram bot for Yad2 search notifications"
authors = ["sagi <you@example.com>"]

packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = "^3.10"
aiogram = "^3.22.0"
pydantic = "^2.0,<2.12"
pydantic-settings = "^2.11.0"
fastapi = "^0.115.0"
mangum = "^0.19.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24.0"

[tool.poetry.scripts]
bot-polling = "src.bot.run_polling:run"
