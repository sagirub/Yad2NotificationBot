service: yad2-notification-bot

frameworkVersion: "3"

# Automatically load variables from .env file
useDotenv: true

provider:
  name: aws
  runtime: python3.11
  region: ${opt:region, 'eu-central-1'}
  stage: ${opt:stage, 'dev'}
  
  # API Gateway settings
  httpApi:
    cors: true

  environment:
    # Bot token - use SSM Parameter Store in production
    TELEGRAM_BOT_TOKEN: ${env:TELEGRAM_BOT_TOKEN, ''}
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}-searches
    STATS_TABLE: ${self:service}-${self:provider.stage}-stats
    AWS_REGION_NAME: ${self:provider.region}
    # Admin chat ID for stats notifications
    ADMIN_CHAT_ID: ${env:ADMIN_CHAT_ID, ''}
    # Separate bot token for admin stats (optional - uses main bot if not set)
    ADMIN_BOT_TOKEN: ${env:ADMIN_BOT_TOKEN, ''}
    # Scanner settings
    STATS_RETENTION_DAYS: "7"
    # Orchestrator settings - budget-based batching
    # Max estimated HTTP requests per worker Lambda (to avoid Yad2 bot protection)
    MAX_REQUESTS_PER_WORKER: "5"
    WORKER_FUNCTION_NAME: ${self:service}-${self:provider.stage}-searchWorkerImg

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.STATS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.STATS_TABLE}/index/*"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"
        - Effect: Allow
          Action:
            - cloudwatch:GetMetricStatistics
            - cloudwatch:GetMetricData
          Resource: "*"
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - "arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage}-searchWorkerImg"

functions:
  # Telegram webhook handler
  telegramWebhook:
    handler: src.api.lambda_entry.handler
    memorySize: 256
    timeout: 25
    events:
      - httpApi:
          path: /webhook
          method: post
      - httpApi:
          path: /health
          method: get

  # Search orchestrator - runs every 30 minutes during scan hours only
  # Splits searches into batches, invokes workers, and sends centralized notification
  #
  # Scan hours: 6 AM - 12 AM Israel time (UTC+2/+3)
  # Cron runs: 3 AM - 10 PM UTC to cover both standard time and DST
  # This avoids wasting Lambda invocations during off-hours
  searchOrchestrator:
    handler: src.scanner.orchestrator.handler
    memorySize: 256
    timeout: 600  # Waits for all container-worker batches synchronously (container cold starts ~20-28s each)
    events:
      # Run every 30 minutes, but only during hours 3-21 UTC (6 AM - midnight Israel)
      # Cron format: minute hour day-of-month month day-of-week year
      - schedule:
          rate: cron(0,30 3-21 * * ? *)
          enabled: true
          description: "Orchestrate Yad2 search scanning every 30 minutes (6 AM - midnight Israel time)"

  # Search worker - invoked by orchestrator with a batch of searches.
  # Runs as a CONTAINER IMAGE (CloakBrowser + Chromium) to bypass Yad2 bot
  # protection. Higher memory + ephemeral storage are required for Chromium.
  searchWorkerImg:
    # Pre-built container image (built & pushed manually via build_worker_image.sh).
    # Pass the image URI at deploy time: WORKER_IMAGE_URI=<ecr-uri>:<tag>
    image: ${env:WORKER_IMAGE_URI}
    memorySize: 2048
    timeout: 300
    ephemeralStorageSize: 2048  # /tmp size in MB (Serverless v3 key)
    # No events - invoked by orchestrator

plugins:
  - serverless-python-requirements
  - serverless-plugin-scripts

custom:
  pythonRequirements:
    # Use Docker to build packages for Linux (required for binary packages like pydantic)
    # Set to true if Docker is running, false otherwise
    dockerizePip: false
    # Use pip to download manylinux wheels
    pipCmdExtraArgs:
      - "--platform"
      - "manylinux2014_x86_64"
      - "--only-binary=:all:"
    # Don't zip requirements - include them directly in the package
    zip: false
    slim: true
    slimPatterns:
      - "**/*.egg-info*"
      - "**/__pycache__"
      - "**/tests"
    noDeploy:
      - pytest
      - pytest-asyncio
      - pip
      - setuptools
      - boto3
      - botocore
      - s3transfer
  
  # Auto-set webhook after deployment
  scripts:
    hooks:
      'deploy:finalize': |
        echo "Setting Telegram webhook..."
        WEBHOOK_URL=$(serverless info --stage ${self:provider.stage} 2>/dev/null | grep "POST -" | awk '{print $3}')
        if [ -n "$WEBHOOK_URL" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"$WEBHOOK_URL\", \"allowed_updates\": [\"message\", \"callback_query\"]}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('✅ Webhook set!' if r.get('ok') else f'❌ Error: {r.get(\"description\")}')"
        else
          echo "⚠️ Skipping webhook setup (TELEGRAM_BOT_TOKEN not set or URL not found)"
        fi

resources:
  Resources:
    # DynamoDB table for user searches
    UserSearchesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: search_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
          - AttributeName: search_id
            KeyType: RANGE
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # DynamoDB table for scanner stats
    ScannerStatsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.STATS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: stat_date
            AttributeType: S
          - AttributeName: stat_hour
            AttributeType: S
        KeySchema:
          - AttributeName: stat_date
            KeyType: HASH
          - AttributeName: stat_hour
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

  Outputs:
    WebhookUrl:
      Description: "Telegram Webhook URL"
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: HttpApi
            - ".execute-api.${self:provider.region}.amazonaws.com/webhook"
      Export:
        Name: ${self:service}-${self:provider.stage}-webhook-url
    
    StatsTableName:
      Description: "Scanner Stats DynamoDB Table"
      Value: ${self:provider.environment.STATS_TABLE}
      Export:
        Name: ${self:service}-${self:provider.stage}-stats-table
